# Label set for the lightai language model. Bump labels_version whenever an intent or slot
# is added, renamed or removed; every dataset row, correction and model records it.
labels_version: 2

intents:
  create_look: "build a new look/function in the show file"
  propose_look: "make an assumption and try something live on a fixture, then ask how it looked"
  probe_fixture: "find out what a channel or color slot does by testing it live"
  feedback: "tell lightai whether the last result looked right, and what was wrong"
  run_function: "start an existing function"
  stop_function: "stop an existing function"
  stop_all: "stop every running function"
  blackout: "fire the kill scene"
  blackout_release: "release the kill scene"
  set_level: "live intensity override on fixtures, fog or the grand master"
  set_channel: "live override of one raw channel"
  release: "clear live overrides"
  fixture_edit.rotate: "rotate a fixture on the 2D stage map"
  fixture_edit.move: "move a fixture on the 2D stage map"
  fixture_edit.rename: "rename a fixture in the patch"
  query.functions: "list or search existing functions"
  query.fixtures: "list or describe fixtures and zones"
  query.status: "what is running right now"
  set_bpm: "set the tempo lightai uses for new looks"
  update_look: "change a look lightai made (color, speed, size, intensity, fade)"
  delete_look: "delete a look lightai made"
  add_widget: "add a Virtual Console button for a function"
  add_fixture: "patch a new fixture from the library"
  none: "not a lighting request"

slots:
  target: "fixtures or zones: fixture 3, the washes, stage left, spot #4"
  function_ref: "name of an existing function: auto chaser show 3"
  color: "blue, warm white, pink"
  movement: "breathing, circles, ballyhoo, chase, sweep, strobe, wave, bounce"
  rate: "60 bpm, slow, fast, every 2 seconds"
  intensity: "50%, full, half, dim"
  fade: "snap, smooth, 2 second fade"
  size: "small, big, wide"
  priority: "override, vip, kill, priority 20"
  angle: "90 degrees, a quarter turn"
  distance: "50 cm, 1 meter"
  direction: "left, right, up, down, mirrored"
  name: "a new name"
  channel: "channel 9"
  value: "a raw DMX value: 128"
  observed: "what the operator actually saw: pink, nothing, the one next to it"
  fixture_model: "V3, BEAM230 V2, the wash model, Chauvet Intimidator Spot 260"
  mode: "a fixture mode: 14 channel mode, extended"
  address: "a DMX address: universe 2 address 150, dmx 289"
