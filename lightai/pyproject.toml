[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lightai"
version = "0.0.1"
description = "Personal, trainable, non-generative lighting AI for the Mayans QLC+ rig"
requires-python = ">=3.12,<3.13"
dependencies = [
  "onnxruntime>=1.19",
  "tokenizers>=0.20",
  "numpy>=1.26",
  "lxml>=5.2",
  "websockets>=13",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "scikit-learn>=1.5",
]

[project.optional-dependencies]
train = [
  "torch>=2.4",
  "transformers>=4.44",
  "onnx>=1.16",
]
dev = ["pytest>=8"]

[project.scripts]
lightai = "lightai.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["lightai*"]
